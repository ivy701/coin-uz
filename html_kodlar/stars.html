<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Telegram Stars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=25.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0f;
            background-image: radial-gradient(circle at 50% 0%, #151624 0%, #0a0a0f 65%);
            color: #ffffff;
            padding: 4px 10px 92px 10px;
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Header */
        .stars-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 2px 0;
            transform: translateZ(0);
        }

        .back-pill-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            transition: transform 120ms ease;
        }

        .back-pill-btn:active {
            transform: scale(0.94);
        }

        .stars-top-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.3px;
        }

        .balance-badge-pill {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 12px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .balance-badge-pill span {
            color: #38bdf8;
        }
        
        .lang-badge-pill {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 120ms ease;
        }

        .lang-badge-pill:active {
            transform: scale(0.94);
        }

        /* Recipient Section (Prominently Placed at the Top) */
        .recipient-section {
            margin-bottom: 14px;
            width: 100%;
        }

        .recipient-dark-bar {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s ease;
        }

        .recipient-dark-bar:focus-within {
            border-color: #38bdf8;
        }

        .recipient-dark-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
        }

        .recipient-dark-input::placeholder {
            color: #64748b;
        }

        .for-me-pill {
            background: #252633;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 120ms ease, background-color 120ms ease;
        }

        .for-me-pill:active {
            transform: scale(0.94);
            background: #2f3142;
        }

        /* 2x2 Star Cards Grid */
        .stars-2x2-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .star-2x2-card {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 135px;
            user-select: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            transition: transform 120ms ease;
        }

        .discount-pill {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
        }

        .star-quantity-row {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .star-badge-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            display: inline-block;
        }

        .star-price-row {
            font-size: 13px;
            font-weight: 700;
            color: #82879a;
            margin-bottom: 12px;
        }

        .star-buy-button {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 9px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 120ms ease;
            text-align: center;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .star-buy-button:active {
            transform: scale(0.96);
        }

        /* Custom Star Quantity Card */
        .custom-stars-card {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .custom-stars-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .custom-stars-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .custom-stars-sub {
            font-size: 11.5px;
            font-weight: 600;
            color: #82879a;
            margin-top: 1px;
        }

        .custom-star-calc-badge {
            background: #252633;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .custom-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        .custom-input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-star-field {
            width: 100%;
            background: #151620;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 11px 12px;
            padding-right: 65px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .custom-star-field:focus {
            border-color: #38bdf8;
        }

        .custom-input-suffix {
            position: absolute;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #82879a;
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
        }

        .custom-buy-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 120ms ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .custom-buy-btn:active {
            transform: scale(0.96);
        }

        .custom-quick-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .custom-quick-chips::-webkit-scrollbar {
            display: none;
        }

        .quick-chip-btn {
            background: #252633;
            color: #82879a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 120ms ease, background-color 120ms ease, color 120ms ease;
        }

        .quick-chip-btn:active, .quick-chip-btn.active {
            background: linear-gradient(135deg, #272836 0%, #1b1c26 100%);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

    </style>
<script>window.API_BASE = "https://web-production-4014a4.up.railway.app";</script>
</head>

                <div class="star-price-row">495 000 UZS</div>

            <button class="star-buy-button" onclick="buyStarTier(2500, 495000, this)" data-i18n="common.buy">Sotib olish</button>

    <!-- Custom Stars Amount Card -->

    <script src="js/common.js?v=28.0"></script>
    <script>
        function setMyUsername() {
            const user = tg?.initDataUnsafe?.user;
            const input = document.getElementById('username');
            if (input) {
                if (user && user.username) input.value = '@' + user.username;
                else if (user && user.id) input.value = user.id;
                else input.value = '@men';
            }
        }

        async function buyStarTier(qty, price, btn) {
            let uVal = (document.getElementById('username')?.value || '').trim().replace(/^@/, '');
            if (!uVal) {
                const tgUser = tg?.initDataUnsafe?.user;
                if (tgUser?.username) uVal = tgUser.username;
                else if (tgUser?.id) uVal = String(tgUser.id);
            }

            if (!uVal) {
                if (tg?.showAlert) tg.showAlert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                else alert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                return;
            }

            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ ...';

            const userId = getUserId();
            const apiBase = (typeof getApiBase === 'function' ? getApiBase() : (window.API_BASE || 'https://web-production-4014a4.up.railway.app')) || 'https://web-production-4014a4.up.railway.app';
            const endpoint = apiBase.replace(/\/$/, '') + '/api/order/stars';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: uVal,
                        quantity: qty,
                        amount: price,
                        product_type: 'stars',
                        initData: tg?.initData || ''
                    })
                });

                let data = null;
                try {
                    data = await res.json();
                } catch(e) {}

                if (data && data.ok) {
                    if (tg?.showAlert) tg.showAlert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    else alert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1000);
                } else {
                    const err = data?.error || (res.status !== 200 ? `Server xatosi (${res.status})` : 'Xaridda xatolik yuz berdi.');
                    if (tg?.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg?.showAlert) tg.showAlert("Server bilan aloqa o'rnatilmadi. Iltimos, qaytadan urinib ko'ring.");
                else alert("Server bilan aloqa o'rnatilmadi. Iltimos, qaytadan urinib ko'ring.");
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        function calcCustomStarPrice() {
            const input = document.getElementById('customStarInput');
            const preview = document.getElementById('customPricePreview');
            let qty = parseInt(input?.value || '0', 10);
            if (isNaN(qty) || qty < 1) qty = 0;
            const price = qty * 198;
            if (preview) preview.textContent = price.toLocaleString('uz-UZ');
            return { qty, price };
        }

        function setQuickStars(qty) {
            const input = document.getElementById('customStarInput');
            if (input) {
                input.value = qty;
                calcCustomStarPrice();
            }
            document.querySelectorAll('.quick-chip-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent.replace(/\s/g, ''), 10) === qty);
            });
        }

        async function buyCustomStars(btn) {
            const { qty, price } = calcCustomStarPrice();
            if (qty < 50) {
                if (tg?.showAlert) tg.showAlert('Minimal Telegram Stars miqdori: 50 Stars');
                else alert('Minimal Telegram Stars miqdori: 50 Stars');
                return;
            }
            await buyStarTier(qty, price, btn);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setMyUsername();
            loadUserBalance();
            calcCustomStarPrice();
        });
    </script>
</body>
