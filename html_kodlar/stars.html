<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Telegram Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=13.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #08090d;
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 14px 14px 110px 14px;
            width: 100%;
            min-height: 100vh;
            background-color: #08090d;
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: visible;
            box-sizing: border-box;
        }

        /* Header */
        .stars-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .stars-page-heading {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stars-heading-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .balance-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
        }
        
        .lang-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
        }

        /* 2x2 Star Cards Grid */
        .stars-2x2-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .star-2x2-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 22px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 155px;
            user-select: none;
        }

        .discount-pill {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #27272a;
            color: #a1a1aa;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
        }

        .star-quantity-row {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .star-badge-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: inline-block;
        }

        .star-price-row {
            font-size: 14px;
            font-weight: 700;
            color: #a1a1aa;
            margin-bottom: 14px;
        }

        .star-buy-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .star-buy-button:active {
            transform: scale(0.96);
            background: #e4e4e7;
        }

        /* Custom Star Quantity Card */
        .custom-stars-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 22px;
            padding: 20px 16px;
            margin-bottom: 18px;
        }

        .custom-stars-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .custom-stars-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .custom-stars-sub {
            font-size: 12px;
            font-weight: 600;
            color: #71717a;
            margin-top: 2px;
        }

        .custom-star-calc-badge {
            background: #27272a;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .custom-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .custom-input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-star-field {
            width: 100%;
            background: #000000;
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 13px 14px;
            padding-right: 70px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            outline: none;
        }

        .custom-star-field:focus {
            border-color: #f59e0b;
        }

        .custom-input-suffix {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #71717a;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
        }

        .custom-buy-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .custom-buy-btn:active {
            transform: scale(0.96);
            background: #e4e4e7;
        }

        .custom-quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .custom-quick-chips::-webkit-scrollbar {
            display: none;
        }

        .quick-chip-btn {
            background: #27272a;
            color: #d4d4d8;
            border: 1px solid #3f3f46;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .quick-chip-btn:active, .quick-chip-btn.active {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #ffffff;
        }

        /* Recipient Input */
        .recipient-dark-bar {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .recipient-dark-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .recipient-dark-input::placeholder {
            color: #52525b;
        }

        .for-me-pill {
            background: #27272a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <div class="stars-top-bar">
        <a href="index.html" class="back-pill-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="balance-badge-pill">
                <span id="balance">0</span> UZS
            </div>
            <button class="lang-badge-pill" onclick="toggleLanguage()" id="langBtn">uz</button>
        </div>
    </div>

    <div class="stars-page-heading">
        <img src="images/star.webp" alt="Telegram Stars" class="stars-heading-icon">
        <span data-i18n="stars.title">Telegram Stars</span>
    </div>

    <!-- 2x2 Stars Grid -->
    <div class="stars-2x2-grid">
        <!-- 50 Stars -->
        <div class="star-2x2-card">
            <div>
                <div class="star-quantity-row">
                    <span>50</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">9 900 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(50, 9900, this)" data-i18n="common.buy">Sotib olish</button>
        </div>

        <!-- 100 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>100</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">19 800 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(100, 19800, this)" data-i18n="common.buy">Sotib olish</button>
        </div>

        <!-- 500 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>500</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">99 000 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(500, 99000, this)" data-i18n="common.buy">Sotib olish</button>
        </div>

        <!-- 1000 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>1 000</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">198 000 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(1000, 198000, this)" data-i18n="common.buy">Sotib olish</button>
        </div>
    </div>

    <!-- Custom Stars Amount Card -->
    <div class="custom-stars-card">
        <div class="custom-stars-top">
            <div>
                <div class="custom-stars-title" data-i18n="stars.custom_title">Boshqa miqdor</div>
                <div class="custom-stars-sub" data-i18n="stars.custom_sub">Ixtiyoriy miqdorni kiriting (min 50)</div>
            </div>
            <div class="custom-star-calc-badge">
                <span id="customPricePreview">9 900</span> UZS
            </div>
        </div>

        <div class="custom-input-row">
            <div class="custom-input-wrap">
                <input type="number" id="customStarInput" class="custom-star-field" placeholder="Masalan: 75" min="50" max="100000" value="50" oninput="calcCustomStarPrice()">
                <div class="custom-input-suffix">
                    <img src="images/star.webp" alt="Star" class="star-badge-icon" style="width: 18px; height: 18px;">
                    <span>Stars</span>
                </div>
            </div>
            <button class="custom-buy-btn" id="customBuyBtn" onclick="buyCustomStars(this)" data-i18n="common.buy">
                Sotib olish
            </button>
        </div>

        <div class="custom-quick-chips">
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(50)">50</button>
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(150)">150</button>
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(250)">250</button>
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(750)">750</button>
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(2500)">2 500</button>
            <button type="button" class="quick-chip-btn" onclick="setQuickStars(5000)">5 000</button>
        </div>
    </div>

    <!-- Recipient Input -->
    <div class="recipient-dark-bar">
        <input type="text" id="username" class="recipient-dark-input" placeholder="@username">
        <button class="for-me-pill" onclick="setMyUsername()" data-i18n="stars.recipient_for_me">O'zimga</button>
    </div>

    <!-- Floating Capsule Dock Navigation -->
    <div class="bottom-dock-nav">
        <a href="index.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9z"></path>
                <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"></path>
            </svg>
            <span data-i18n="nav.home">Asosiy</span>
        </a>
        <a href="gift.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l4 6-10 12L2 9z"></path>
                <path d="M2 9h20"></path>
                <path d="M10 3l-3 6 5 12 5-12-3-6"></path>
            </svg>
            <span data-i18n="nav.gifts">Gift</span>
        </a>
        <a href="rating.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>
            <span data-i18n="nav.rating">Top</span>
        </a>
        <a href="profile.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span data-i18n="nav.profile">Profil</span>
        </a>
    </div>

    <script src="js/common.js"></script>
    <script>
        function setMyUsername() {
            const user = tg?.initDataUnsafe?.user;
            const input = document.getElementById('username');
            if (input) {
                if (user && user.username) input.value = '@' + user.username;
                else if (user && user.id) input.value = user.id;
                else input.value = '@men';
            }
        }

        async function buyStarTier(qty, price, btn) {
            let uVal = (document.getElementById('username')?.value || '').trim().replace(/^@/, '');
            if (!uVal) {
                const tgUser = tg?.initDataUnsafe?.user;
                if (tgUser?.username) uVal = tgUser.username;
                else if (tgUser?.id) uVal = String(tgUser.id);
            }

            if (!uVal) {
                if (tg?.showAlert) tg.showAlert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                else alert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                return;
            }

            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ ...';

            const userId = getUserId();
            const apiBase = getApiBase();

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: uVal,
                        quantity: qty,
                        amount: price,
                        product_type: 'stars',
                        initData: tg?.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg?.showAlert) tg.showAlert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    else alert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1000);
                } else {
                    const err = data?.error || 'Xaridda xatolik yuz berdi.';
                    if (tg?.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg?.showAlert) tg.showAlert('Serverga ulanishda xatolik: ' + err.message);
                else alert('Serverga ulanishda xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        function calcCustomStarPrice() {
            const input = document.getElementById('customStarInput');
            const preview = document.getElementById('customPricePreview');
            let qty = parseInt(input?.value || '0', 10);
            if (isNaN(qty) || qty < 1) qty = 0;
            const price = qty * 198;
            if (preview) preview.textContent = price.toLocaleString('uz-UZ');
            return { qty, price };
        }

        function setQuickStars(qty) {
            const input = document.getElementById('customStarInput');
            if (input) {
                input.value = qty;
                calcCustomStarPrice();
            }
            document.querySelectorAll('.quick-chip-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent.replace(/\s/g, ''), 10) === qty);
            });
        }

        async function buyCustomStars(btn) {
            const { qty, price } = calcCustomStarPrice();
            if (qty < 50) {
                if (tg?.showAlert) tg.showAlert('Minimal Telegram Stars miqdori: 50 Stars');
                else alert('Minimal Telegram Stars miqdori: 50 Stars');
                return;
            }
            await buyStarTier(qty, price, btn);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setMyUsername();
            loadUserBalance();
            calcCustomStarPrice();
        });
    </script>
</body>

</html>
