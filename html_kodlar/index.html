<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=25.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #0a0a0f;
            background-image: radial-gradient(circle at 50% 0%, #151624 0%, #0a0a0f 65%);
            color: #ffffff;
            overflow-x: hidden;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            padding: 4px 10px 92px 10px;
            min-height: 100vh;
        }

        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Top Header Bar (Zero scroll repaint with translateZ) */
        .top-user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0;
            margin-bottom: 12px;
            padding: 2px 2px;
            width: 100%;
            box-sizing: border-box;
            transform: translateZ(0);
        }

        .user-left-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-names-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-display-name {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .user-handle-name {
            font-size: 13px;
            font-weight: 600;
            color: #82879a;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: opacity 120ms ease;
        }

        .user-handle-name:active {
            opacity: 0.7;
        }

        .lang-badge-pill {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 120ms ease, background-color 120ms ease;
            user-select: none;
        }

        .lang-badge-pill:active {
            transform: scale(0.94);
            background: #272733;
        }

        /* Sleek Modern Fintech Balance Card with Geometric Lines */
        .hero-balance-card {
            background: linear-gradient(145deg, #161724 0%, #0f1018 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 20px 18px 18px 18px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 12px 30px -8px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: translateZ(0);
        }

        /* Abstract Concentric Radar Lines Pattern */
        .card-radar-lines {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 240px;
            height: 240px;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .card-radar-lines svg {
            width: 100%;
            height: 100%;
        }

        .hero-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .hero-card-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-card-top-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #82879a;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .balance-eye-btn {
            background: transparent;
            border: none;
            color: #82879a;
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 120ms ease;
        }

        .balance-eye-btn:hover, .balance-eye-btn:active {
            color: #ffffff;
        }

        .hero-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-glowing-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 4px #38bdf8;
            display: inline-block;
        }

        .hero-card-tag-pill {
            font-size: 11px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.22);
            padding: 4px 10px;
            border-radius: 999px;
            letter-spacing: 0.3px;
        }

        .hero-card-middle {
            display: flex;
            align-items: baseline;
            gap: 6px;
            position: relative;
            z-index: 2;
        }

        .hero-card-balance-num {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.6px;
            line-height: 1;
            display: inline-block;
        }

        .hero-card-unit {
            font-size: 16px;
            font-weight: 800;
            color: #82879a;
        }

        .hero-card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 2;
            margin-top: 2px;
        }

        .stars-equiv-badge-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #1c1d28;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 800;
            color: #fbbf24;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease;
            user-select: none;
            white-space: nowrap;
        }

        .stars-equiv-badge-btn:active {
            transform: scale(0.96);
            background: #252736;
        }

        .hero-btn-primary {
            flex: 1.1;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 13.5px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 120ms ease;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            user-select: none;
            white-space: nowrap;
        }

        .hero-btn-primary:active {
            transform: scale(0.96);
        }

        /* 3-Column Stats Grid */
        .stats-tri-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-card-box {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform 120ms ease, background-color 120ms ease;
        }

        .stat-card-box:active {
            transform: scale(0.96);
            background: #232430;
        }

        .stat-label-text {
            font-size: 11px;
            font-weight: 600;
            color: #82879a;
        }

        .stat-value-text {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-unit-text {
            font-size: 10px;
            font-weight: 700;
            color: #82879a;
        }

        /* VIP Lucky Spin Banner */
        .vip-spin-banner {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(28, 28, 36, 0.95) 100%);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 13px 15px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease;
            user-select: none;
        }

        .vip-spin-banner:active {
            transform: scale(0.97);
        }

        /* 4 Services Grid (2x2) */
        .services-quad-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .service-quad-card {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
            user-select: none;
        }

        .service-quad-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: #232430;
        }

        .service-quad-card:active {
            transform: scale(0.96);
        }

        .service-icon-wrap {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-icon-wrap img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .service-card-title {
            font-size: 13.5px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Responsive */
        @media screen and (max-height: 750px) {
            body {
                padding: 8px 8px 90px 8px;
            }
            .hero-card-balance-num {
                font-size: 28px;
            }
        }
    </style>
<script>window.API_BASE = "https://coinstatuzbot.alwaysdata.net";</script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserBalance();
            fetchTransactions();

            const userId = String(getUserId() || '');
            if (userId) {
                const maskEl = document.getElementById('cardMaskUid');
                if (maskEl) maskEl.textContent = userId.slice(-4) || '0000';
            }

            const holderEl = document.getElementById('cardHolderName');
            if (holderEl && tg.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                holderEl.textContent = u.username ? ('@' + u.username) : (((u.first_name || '') + ' ' + (u.last_name || '')).trim() || 'VIP FOYDALANUVCHI');
            }
        });

        async function fetchTransactions() {
            const userId = getUserId();
            const apiBase = getApiBase();
            if (!userId) return;

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/user/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ telegram_id: userId, initData: tg.initData || '' })
                });
                const data = await res.json();
                if (data && data.ok) {
                    const cnt = document.getElementById('ordersCount');
                    const spent = document.getElementById('totalSpent');

                    // Filter only real purchase orders (exclude any topup and deposits)
                    const purchaseOrders = (data.orders || []).filter(o => {
                        const pt = String(o.product_type || o.type || '').toLowerCase();
                        return !pt.startsWith('topup') && 
                               pt !== 'deposit' && 
                               pt !== 'balance' &&
                               o.status !== 'cancelled' &&
                               o.status !== 'failed' &&
                               o.status !== 'rejected';
                    });

                    const ordersCount = (typeof data.orders_count === 'number') ? data.orders_count : purchaseOrders.length;
                    if (cnt) cnt.textContent = String(ordersCount);
                    try { localStorage.setItem('cs_stat_orders_' + userId, String(ordersCount)); } catch(e){}

                    let totalSpent = 0;
                    if (typeof data.total_spent === 'number') {
                        totalSpent = data.total_spent;
                    } else {
                        purchaseOrders.forEach(o => {
                            if (o.status === 'completed' || o.status === 'paid') {
                                totalSpent += Number(o.amount || 0);
                            }
                        });
                    }

                    if (spent) {
                        let formattedText = '';
                        if (totalSpent >= 1000000) {
                            const m = (totalSpent / 1000000);
                            formattedText = (m % 1 === 0 ? m.toFixed(0) : m.toFixed(1)) + 'M';
                        } else if (totalSpent >= 1000) {
                            const k = (totalSpent / 1000);
                            formattedText = (k % 1 === 0 ? k.toFixed(0) : k.toFixed(1)) + 'k';
                        } else {
                            formattedText = totalSpent.toLocaleString('uz-UZ');
                        }
                        spent.textContent = formattedText;
                        try { localStorage.setItem('cs_stat_spent_' + userId, formattedText); } catch(e){}
                    }
                }
            } catch (e) {}
        }
    </script>
</body>

</html>
