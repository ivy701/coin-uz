<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Telegram Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 4px 8px 90px 8px;
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Top Bar */
        .premium-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .balance-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .lang-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
        }

        .premium-page-heading {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .premium-heading-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .plan-premium-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: inline-block;
        }

        /* Premium Plans Grid */
        .premium-plans-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .premium-plan-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 22px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .premium-plan-card.selected {
            border-color: #ffffff;
            background: #1a1a22;
        }

        .plan-left-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plan-title-text {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-discount-tag {
            background: #27272a;
            color: #a1a1aa;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .plan-price-text {
            font-size: 14px;
            font-weight: 700;
            color: #a1a1aa;
        }

        .plan-radio-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #3f3f46;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .premium-plan-card.selected .plan-radio-circle {
            border-color: #ffffff;
            background: #ffffff;
        }

        .premium-plan-card.selected .plan-radio-circle::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000000;
        }

        /* Recipient Input */
        .recipient-dark-bar {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .recipient-dark-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .recipient-dark-input::placeholder {
            color: #52525b;
        }

        .for-me-pill {
            background: #27272a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Submit CTA */
        .premium-submit-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .premium-submit-btn:active {
            transform: scale(0.98);
            background: #e4e4e7;
        }

    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="premium-top-bar">
        <a href="index.html" class="back-pill-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="balance-badge-pill">
                <span id="balance">0</span> UZS
            </div>
            <button class="lang-badge-pill" onclick="toggleLanguage()" id="langBtn">uz</button>
        </div>
    </div>

    <div class="premium-page-heading">
        <img src="images/premium.webp" alt="Telegram Premium" class="premium-heading-icon">
        <span data-i18n="premium.title">Telegram Premium</span>
    </div>

    <!-- Plans Grid -->
    <div class="premium-plans-grid">
        <!-- 3 Oylik -->
        <div class="premium-plan-card selected" onclick="selectPlan(3, 160000, this)">
            <div class="plan-left-col">
                <div class="plan-title-text">
                    <img src="images/premium.webp" alt="Premium" class="plan-premium-icon">
                    <span data-i18n="premium.3_months">3 Oylik Premium</span>
                </div>
                <div class="plan-price-text">160 000 UZS</div>
            </div>
            <div class="plan-radio-circle"></div>
        </div>

        <!-- 6 Oylik -->
        <div class="premium-plan-card" onclick="selectPlan(6, 225000, this)">
            <div class="plan-left-col">
                <div class="plan-title-text">
                    <img src="images/premium.webp" alt="Premium" class="plan-premium-icon">
                    <span data-i18n="premium.6_months">6 Oylik Premium</span>
                    <span class="plan-discount-tag">-15%</span>
                </div>
                <div class="plan-price-text">225 000 UZS</div>
            </div>
            <div class="plan-radio-circle"></div>
        </div>

        <!-- 12 Oylik -->
        <div class="premium-plan-card" onclick="selectPlan(12, 390000, this)">
            <div class="plan-left-col">
                <div class="plan-title-text">
                    <img src="images/premium.webp" alt="Premium" class="plan-premium-icon">
                    <span data-i18n="premium.12_months">12 Oylik Premium</span>
                    <span class="plan-discount-tag">-30%</span>
                </div>
                <div class="plan-price-text">390 000 UZS</div>
            </div>
            <div class="plan-radio-circle"></div>
        </div>
    </div>

    <!-- Recipient Input -->
    <div class="recipient-dark-bar">
        <input type="text" id="username" class="recipient-dark-input" placeholder="@username">
        <button class="for-me-pill" onclick="setMyUsername()" data-i18n="stars.recipient_for_me">O'zimga</button>
    </div>

    <!-- Submit Button -->
    <button class="premium-submit-btn" id="submitBtn" onclick="buyPremium()" data-i18n="common.buy">Sotib olish</button>

    <!-- Floating Capsule Dock Navigation -->
    <div class="bottom-dock-nav">
        <a href="index.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9z"></path>
                <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"></path>
            </svg>
            <span data-i18n="nav.home">Asosiy</span>
        </a>
        <a href="gift.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l4 6-10 12L2 9z"></path>
                <path d="M2 9h20"></path>
                <path d="M10 3l-3 6 5 12 5-12-3-6"></path>
            </svg>
            <span data-i18n="nav.gifts">Gift</span>
        </a>
        <a href="rating.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>
            <span data-i18n="nav.rating">Top</span>
        </a>
        <a href="profile.html" class="dock-tab-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span data-i18n="nav.profile">Profil</span>
        </a>
    </div>

    <script src="js/common.js"></script>
    <script>
        let selectedMonths = 3;
        let selectedPrice = 160000;

        function selectPlan(months, price, el) {
            selectedMonths = months;
            selectedPrice = price;
            document.querySelectorAll('.premium-plan-card').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
        }

        function setMyUsername() {
            const user = tg.initDataUnsafe?.user;
            const input = document.getElementById('username');
            if (input) {
                if (user && user.username) input.value = '@' + user.username;
                else if (user && user.id) input.value = user.id;
                else input.value = '@men';
            }
        }

        async function buyPremium() {
            let uVal = (document.getElementById('username')?.value || '').trim().replace(/^@/, '');
            if (!uVal) {
                const tgUser = tg.initDataUnsafe?.user;
                if (tgUser?.username) uVal = tgUser.username;
            }

            if (!uVal) {
                if (tg.showAlert) tg.showAlert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                else alert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ ...';

            const userId = getUserId();
            const apiBase = getApiBase();

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: uVal,
                        months: selectedMonths,
                        product_type: `Premium ${selectedMonths} oy`,
                        amount: selectedPrice,
                        initData: tg.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg.showAlert) tg.showAlert(`✅ ${selectedMonths} Oylik Telegram Premium muvaffaqiyatli xarid qilindi!`);
                    else alert(`✅ ${selectedMonths} Oylik Telegram Premium muvaffaqiyatli xarid qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1000);
                } else {
                    const err = data?.error || 'Xaridda xatolik yuz berdi.';
                    if (tg.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg.showAlert) tg.showAlert('Serverga ulanishda xatolik: ' + err.message);
                else alert('Serverga ulanishda xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setMyUsername();
            loadUserBalance();
        });
    </script>
</body>

</html>
