<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ — Top Reyting</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --gold-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            --gold-glow: rgba(245, 158, 11, 0.25);
            --silver-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            --bronze-gradient: linear-gradient(135deg, #fb923c 0%, #b45309 100%);
            --glass-bg: rgba(20, 21, 29, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: #08080c;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 10% 40%, rgba(56, 189, 248, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 90% 60%, rgba(168, 85, 247, 0.06) 0%, transparent 45%);
            color: #ffffff;
            padding: 16px;
            padding-bottom: 130px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Brand Header */
        .rating-top-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
            padding-top: 4px;
        }

        .rating-top-brand img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .rating-top-brand span {
            font-size: 14px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: -0.2px;
        }

        .rating-page-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Period Filter Tabs */
        .period-tabs-bar {
            display: flex;
            background: rgba(22, 23, 31, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 4px;
            margin-bottom: 22px;
            justify-content: space-between;
            gap: 4px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .period-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 4px;
            border-radius: 999px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .period-tab-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        /* Top 3 Podium Box */
        .podium-box-container {
            background: rgba(18, 19, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 20px 14px 16px 14px;
            margin-bottom: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 
                0 20px 40px -15px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .podium-box-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .podium-box-header {
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: -0.3px;
        }

        .podium-cylinders-row {
            display: grid;
            grid-template-columns: 1fr 1.18fr 1fr;
            align-items: end;
            gap: 8px;
            min-height: 220px;
        }

        .podium-column {
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 6px 14px 6px;
            text-align: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* 1st Place (Center - Gold Masterpiece) */
        .podium-column.first {
            min-height: 220px;
            background: linear-gradient(180deg, rgba(251, 191, 36, 0.22) 0%, rgba(30, 24, 16, 0.95) 45%, rgba(18, 19, 26, 0.98) 100%);
            border: 1px solid rgba(251, 191, 36, 0.5);
            box-shadow: 
                0 10px 30px rgba(245, 158, 11, 0.22),
                inset 0 1px 2px rgba(251, 191, 36, 0.4);
            transform: translateY(-4px);
        }

        /* 2nd Place (Left - Silver Masterpiece) */
        .podium-column.second {
            min-height: 185px;
            background: linear-gradient(180deg, rgba(203, 213, 225, 0.16) 0%, rgba(24, 25, 34, 0.95) 45%, rgba(18, 19, 26, 0.98) 100%);
            border: 1px solid rgba(203, 213, 225, 0.35);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* 3rd Place (Right - Bronze Masterpiece) */
        .podium-column.third {
            min-height: 170px;
            background: linear-gradient(180deg, rgba(251, 146, 60, 0.14) 0%, rgba(28, 22, 18, 0.95) 45%, rgba(18, 19, 26, 0.98) 100%);
            border: 1px solid rgba(251, 146, 60, 0.35);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Crown on #1 */
        .podium-crown {
            position: absolute;
            top: -2px;
            font-size: 16px;
            filter: drop-shadow(0 2px 8px rgba(251, 191, 36, 0.8));
            animation: crownFloat 2.5s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .podium-avatar-wrap {
            position: relative;
            margin-bottom: 10px;
            margin-top: 10px;
        }

        .podium-column.first .podium-avatar-wrap {
            margin-top: 14px;
        }

        .podium-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .podium-column.first .podium-avatar-img {
            width: 58px;
            height: 58px;
            border: 3px solid #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .podium-column.second .podium-avatar-img {
            border: 2.5px solid #cbd5e1;
            box-shadow: 0 0 15px rgba(203, 213, 225, 0.3);
        }

        .podium-column.third .podium-avatar-img {
            border: 2.5px solid #fb923c;
            box-shadow: 0 0 15px rgba(251, 146, 60, 0.3);
        }

        .podium-badge-pill {
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 900;
            padding: 2px 9px;
            border-radius: 999px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.2px;
        }

        .badge-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000000;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
        }

        .badge-silver {
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            color: #0f172a;
        }

        .badge-bronze {
            background: linear-gradient(135deg, #fdba74 0%, #f97316 100%);
            color: #000000;
        }

        .podium-username {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
            margin-top: 6px;
            margin-bottom: 3px;
            letter-spacing: -0.2px;
        }

        .podium-column.first .podium-username {
            font-size: 13px;
            color: #fef08a;
            max-width: 100px;
        }

        .podium-amount {
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -0.3px;
        }

        .podium-column.first .podium-amount {
            color: #fbbf24;
            font-size: 14px;
        }

        .podium-subtext {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Leaderboard List Rows */
        .list-section-header {
            font-size: 14px;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 12px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rating-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .leader-row-card {
            background: rgba(20, 21, 29, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .leader-row-card:active {
            background: rgba(30, 32, 44, 0.95);
            transform: scale(0.99);
        }

        .leader-row-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .leader-row-rank {
            font-size: 13px;
            font-weight: 900;
            color: #64748b;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .leader-row-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            background: #1e293b;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .leader-row-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .leader-row-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .leader-row-username {
            font-size: 14px;
            font-weight: 800;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 135px;
            letter-spacing: -0.2px;
        }

        .leader-row-tag {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 1px;
        }

        .leader-row-right {
            text-align: right;
            flex-shrink: 0;
        }

        .leader-row-turnover-val {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.4px;
        }

        .leader-row-turnover-label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* User My Rank Floating Card */
        .user-my-rank-dock {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 22px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 
                0 10px 30px -5px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(56, 189, 248, 0.15);
        }

        .my-rank-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            overflow: hidden;
            flex-shrink: 0;
        }

        .my-rank-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Top Brand Header -->

    <!-- Period Filter Tabs -->
    <div class="period-tabs-bar">
        <button class="period-tab-btn" onclick="switchPeriod('today', this)">Bugun</button>

        <button class="period-tab-btn" onclick="switchPeriod('month', this)">Oylik</button>

    <!-- Top 3 Leaderboard Podium -->
    <div class="podium-box-container">

            <div class="podium-column second" id="podium2">

            <!-- #1 First (Center) -->

                    <div class="podium-badge-pill badge-gold">🥇 #1</div>
                </div>
                <div class="podium-username" id="podiumUser1">@coinstat_king</div>
                <div class="podium-amount" id="podiumAmount1">0 UZS</div>

            </div>

            <!-- #3 Third (Right) -->
            <div class="podium-column third" id="podium3">
                <div class="podium-avatar-wrap">
                    <img src="./images/logo.png" id="podiumAvatar3" class="podium-avatar-img" alt="3rd">
                    <div class="podium-badge-pill badge-bronze">🥉 #3</div>
                </div>
                <div class="podium-username" id="podiumUser3">@crypto_king</div>
                <div class="podium-amount" id="podiumAmount3">0 UZS</div>
                <div class="podium-subtext">Aylanma</div>
            </div>
        </div>
    </div>

    <!-- Leaderboard Rows (#4 onwards) -->
    <div class="list-section-header">
        <span>Boshqa yetakchilar</span>
        <span>Aylanma</span>
    </div>

    <div class="rating-list-wrapper" id="leaderboardList">
        <!-- Dynamic content filled by JavaScript -->
    </div>

    <!-- User My Rank Bottom Floating Card -->
    <div class="user-my-rank-dock">
        <div class="leader-row-left">
            <div class="my-rank-avatar">
                <img src="./images/logo.png" id="myAvatarImg" alt="Me" onerror="this.src='./images/logo.png'">
            </div>
            <div class="leader-row-info">
                <div style="font-size: 14px; font-weight: 900; color: #ffffff; display: flex; align-items: center; gap: 6px;">
                    Sizning o'rningiz: <span id="myRankNum" style="color: #fbbf24;">—</span>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #94a3b8;">Umumiy faollik reytingida</div>
            </div>
        </div>
        <div class="leader-row-right">
            <div class="leader-row-turnover-val" id="myTurnoverVal" style="color: #38bdf8;">0 UZS</div>
            <div class="leader-row-turnover-label">Aylanma</div>
        </div>
    </div>

    <!-- Floating Capsule Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9z"></path>
                <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"></path>
            </svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l4 6-10 12L2 9z"></path>
                <path d="M2 9h20"></path>
                <path d="M10 3l-3 6 5 12 5-12-3-6"></path>
            </svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn active" onclick="window.location.href='rating.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>

        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profil</span>
        </div>

    <script src="js/common.js"></script>
    <script>
        function switchPeriod(period, btn) {
            document.querySelectorAll('.period-tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            loadRatingData(period);
        }

        async function loadRatingData(period = 'week') {
            const apiBase = getApiBase();
            const currentUserId = String(getUserId() || '');

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/rating', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ period: period, initData: tg.initData || '' })
                });
                const data = await res.json();
                const list = (data && data.ok && Array.isArray(data.rating)) ? data.rating : [];
                renderPodiumAndList(list, currentUserId);
            } catch (err) {
                renderPodiumAndList([], currentUserId);
            }
        }

        function getAvatarUrl(item, currentUserId) {
            if (!item) return './images/logo.png';
            const tgUser = tg?.initDataUnsafe?.user;
            const rawUsername = String(item.username || '').replace(/^@/, '').toLowerCase();
            const tgUsername = String(tgUser?.username || '').replace(/^@/, '').toLowerCase();
            const isMe = (String(item.telegram_id) === String(currentUserId)) || (tgUsername && rawUsername === tgUsername);

            if (isMe && tgUser?.photo_url) {
                return tgUser.photo_url;
            }
            if (item.photo_url) return item.photo_url;
            if (item.avatar_url) return item.avatar_url;

            const letter = (item.username || item.full_name || 'U').replace(/^@/, '')[0]?.toUpperCase() || 'U';
            const colors = ['2563eb', '7c3aed', 'db2777', 'ea580c', '059669', '0284c7'];
            const color = colors[Math.abs(Number(item.telegram_id || 0)) % colors.length] || '2563eb';
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(letter)}&background=${color}&color=fff&bold=true&rounded=true&size=128`;
        }

        function renderPodiumAndList(list, currentUserId) {
            const container = document.getElementById('leaderboardList');
            const av1 = document.getElementById('podiumAvatar1');
            const av2 = document.getElementById('podiumAvatar2');
            const av3 = document.getElementById('podiumAvatar3');
            const myAv = document.getElementById('myAvatarImg');

            if (myAv && tg.initDataUnsafe?.user?.photo_url) {
                myAv.src = tg.initDataUnsafe.user.photo_url;
            }

            // 1st Place (Center)
            if (list[0] && list[0].total > 0) {
                document.getElementById('podiumUser1').textContent = '@' + (list[0].username || 'User#' + list[0].telegram_id);
                document.getElementById('podiumAmount1').textContent = Number(list[0].total).toLocaleString('uz-UZ') + ' UZS';
                document.getElementById('podium1').style.opacity = '1';
                if (av1) av1.src = getAvatarUrl(list[0], currentUserId);
            } else {
                document.getElementById('podiumUser1').textContent = 'Bo\'sh';
                document.getElementById('podiumAmount1').textContent = '0 UZS';
                document.getElementById('podium1').style.opacity = '0.5';
                if (av1) av1.src = './images/logo.png';
            }

            // 2nd Place (Left)
            if (list[1] && list[1].total > 0) {
                document.getElementById('podiumUser2').textContent = '@' + (list[1].username || 'User#' + list[1].telegram_id);
                document.getElementById('podiumAmount2').textContent = Number(list[1].total).toLocaleString('uz-UZ') + ' UZS';
                document.getElementById('podium2').style.opacity = '1';
                if (av2) av2.src = getAvatarUrl(list[1], currentUserId);
            } else {
                document.getElementById('podiumUser2').textContent = 'Bo\'sh';
                document.getElementById('podiumAmount2').textContent = '0 UZS';
                document.getElementById('podium2').style.opacity = '0.5';
                if (av2) av2.src = './images/logo.png';
            }

            // 3rd Place (Right)
            if (list[2] && list[2].total > 0) {
                document.getElementById('podiumUser3').textContent = '@' + (list[2].username || 'User#' + list[2].telegram_id);
                document.getElementById('podiumAmount3').textContent = Number(list[2].total).toLocaleString('uz-UZ') + ' UZS';
                document.getElementById('podium3').style.opacity = '1';
                if (av3) av3.src = getAvatarUrl(list[2], currentUserId);
            } else {
                document.getElementById('podiumUser3').textContent = 'Bo\'sh';
                document.getElementById('podiumAmount3').textContent = '0 UZS';
                document.getElementById('podium3').style.opacity = '0.5';
                if (av3) av3.src = './images/logo.png';
            }

            // Remaining list rows (from #4 onwards)
            let html = '';
            let myRank = null;
            let myTurnover = 0;

            list.forEach((item, i) => {
                const rank = i + 1;
                const rawUsername = (item.username || '').replace(/^@/, '');
                const uname = rawUsername ? '@' + rawUsername : 'User#' + (item.telegram_id || (i + 1));
                const totalVal = Number(item.total || 0);
                const totalFormatted = totalVal.toLocaleString('uz-UZ') + ' UZS';
                const rowAvatar = getAvatarUrl(item, currentUserId);

                const tgUsername = (tg.initDataUnsafe?.user?.username || '').replace(/^@/, '');
                if (String(item.telegram_id) === currentUserId || (tgUsername && rawUsername.toLowerCase() === tgUsername.toLowerCase())) {
                    myRank = rank;
                    myTurnover = totalVal;
                }

                if (rank > 3 && totalVal > 0) {
                    html += `
                        <div class="leader-row-card">
                            <div class="leader-row-left">
                                <div class="leader-row-rank">#${rank}</div>
                                <div class="leader-row-avatar">
                                    <img src="${rowAvatar}" alt="${uname}" onerror="this.src='./images/logo.png'">
                                </div>
                                <div class="leader-row-info">
                                    <div class="leader-row-username">${uname}</div>
                                    <div class="leader-row-tag">🔥 Faol Xaridor</div>
                                </div>
                            </div>
                            <div class="leader-row-right">
                                <div class="leader-row-turnover-val">${totalFormatted}</div>
                                <div class="leader-row-turnover-label">Aylanma</div>
                            </div>
                        </div>
                    `;
                }
            });

            if (list.length === 0) {
                html = `
                    <div style="text-align: center; padding: 35px 16px; color: #64748b; font-size: 13px; font-weight: 700; background: rgba(22,23,31,0.5); border-radius: 20px; border: 1px dashed rgba(255,255,255,0.06);">
                        🛍 Hozircha hech kim xarid qilmagan.<br><span style="color: #38bdf8;">Birinchi bo'lib xarid qiling va 1-o'rinni egallang!</span>
                    </div>
                `;
            }

            container.innerHTML = html;

            const myRankEl = document.getElementById('myRankNum');
            const myTurnoverEl = document.getElementById('myTurnoverVal');

            const setRankUI = (rank, turnover) => {
                if (myRankEl) {
                    if (rank) myRankEl.textContent = `#${rank}`;
                    else if (turnover > 0) myRankEl.textContent = '#1';
                    else myRankEl.textContent = '—';
                }
                if (myTurnoverEl) {
                    myTurnoverEl.textContent = turnover > 0 ? Number(turnover).toLocaleString('uz-UZ') + ' UZS' : '0 UZS';
                }
            };

            setRankUI(myRank, myTurnover);

            // Fetch personal spent turnover from transactions if not determined
            const apiBase = getApiBase();
            if (currentUserId && !myRank) {
                fetch((apiBase ? apiBase : '') + '/api/user/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ telegram_id: currentUserId, initData: tg.initData || '' })
                }).then(r => r.json()).then(tData => {
                    if (tData && tData.ok && typeof tData.total_spent === 'number') {
                        if (tData.total_spent > 0) {
                            myTurnover = tData.total_spent;
                            setRankUI(myRank || (list.length === 0 ? 1 : null), myTurnover);
                        }
                    }
                }).catch(() => {});
            }

            if (tg.initDataUnsafe?.user?.photo_url) {
                const myAv = document.getElementById('myAvatarImg');
                if (myAv) myAv.src = tg.initDataUnsafe.user.photo_url;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRatingData('week');
        });
    </script>
</body>

</html>
