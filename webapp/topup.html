<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Balans To'ldirish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Top Bar */
        .topup-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .balance-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .topup-page-heading {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Card Requisites Box */
        .card-requisites-box {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-type-label {
            font-size: 13px;
            font-weight: 700;
            color: #a1a1aa;
        }

        .card-number-display {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .card-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-holder-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .copy-pill-button {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-pill-button:active {
            background: #e4e4e7;
        }

        /* Amount Presets Grid */
        .amount-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #a1a1aa;
            margin-bottom: 12px;
        }

        .amount-chips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .amount-chip-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .amount-chip-card.selected {
            background: #27272a;
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Custom Input */
        .custom-amount-bar {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-amount-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
        }

        .custom-amount-input::placeholder {
            color: #52525b;
        }

        /* Submit Button */
        .topup-submit-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .topup-submit-button:active {
            transform: scale(0.98);
            background: #e4e4e7;
        }

        /* Help Box */
        .topup-help-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .topup-help-text {
            font-size: 13px;
            color: #a1a1aa;
            line-height: 1.4;
            font-weight: 500;
        }

        .topup-admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #18181b;
            border: 1px solid #27272a;
            color: #38bdf8;
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            width: 100%;
        }

        .topup-admin-btn:active {
            transform: scale(0.98);
            background: #27272a;
        }

    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="topup-top-bar">
        <div class="back-pill-btn" onclick="window.location.href='index.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="balance-badge-pill">
            <span id="balance">0</span> UZS
        </div>
    </div>

    <div class="topup-page-heading">Balans To'ldirish</div>

    <!-- Official Card Box -->
    <div class="card-requisites-box">
        <div class="card-header-row">
            <span class="card-type-label">UZCARD / HUMO</span>
            <span style="font-size: 11px; font-weight: 700; color: #4ade80;">● Aktiv</span>
        </div>
        <div class="card-number-display" id="cardNumberText">4916 9903 6986 6493</div>
        <div class="card-footer-row">
            <div class="card-holder-name" id="cardHolderName">COINSTAT UZ RASMIY</div>
            <button class="copy-pill-button" onclick="copyCardNumber()">Nusxalash</button>
        </div>
    </div>

    <!-- Amount Presets Grid -->
    <div class="amount-section-title">To'lov summasini tanlang</div>
    <div class="amount-chips-grid">
        <div class="amount-chip-card" onclick="selectAmount(10000, this)">10 000</div>
        <div class="amount-chip-card selected" onclick="selectAmount(25000, this)">25 000</div>
        <div class="amount-chip-card" onclick="selectAmount(50000, this)">50 000</div>
        <div class="amount-chip-card" onclick="selectAmount(100000, this)">100 000</div>
        <div class="amount-chip-card" onclick="selectAmount(250000, this)">250 000</div>
        <div class="amount-chip-card" onclick="selectAmount(500000, this)">500 000</div>
    </div>

    <!-- Custom Amount Input -->
    <div class="custom-amount-bar">
        <input type="number" id="customAmountInput" class="custom-amount-input" placeholder="Boshqa summa (so'mda)" oninput="onCustomAmountInput()">
    </div>

    <!-- Submit Payment Confirmation -->
    <button class="topup-submit-button" id="submitBtn" onclick="submitTopup()">To'lovni amalga oshirdim</button>

    <!-- Help & Support Box -->
    <div class="topup-help-box">
        <div class="topup-help-text">Agar to'lov qilishda qiynalsangiz, adminga murojaat qiling:</div>
        <a href="https://t.me/cofeature" target="_blank" class="topup-admin-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>👨‍💻 Adminga murojaat qilish</span>
        </a>
    </div>

    <!-- Floating Capsule Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9z"></path>
                <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"></path>
            </svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l4 6-10 12L2 9z"></path>
                <path d="M2 9h20"></path>
                <path d="M10 3l-3 6 5 12 5-12-3-6"></path>
            </svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let selectedAmount = 25000;

        function selectAmount(val, el) {
            selectedAmount = val;
            document.querySelectorAll('.amount-chip-card').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
            document.getElementById('customAmountInput').value = '';
        }

        function onCustomAmountInput() {
            const val = parseInt(document.getElementById('customAmountInput').value, 10);
            if (val && val > 0) {
                selectedAmount = val;
                document.querySelectorAll('.amount-chip-card').forEach(c => c.classList.remove('selected'));
            }
        }

        function copyCardNumber() {
            const num = document.getElementById('cardNumberText').textContent.replace(/\s+/g, '');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(num);
                if (tg.showAlert) tg.showAlert('Karta raqami nusxalandi: ' + num);
                else alert('Karta raqami nusxalandi: ' + num);
            }
        }

        async function submitTopup() {
            const userId = getUserId();
            const apiBase = getApiBase();

            if (!selectedAmount || selectedAmount < 1000) {
                if (tg.showAlert) tg.showAlert('Iltimos, to\'g\'ri summa kiriting (kamida 1,000 so\'m)');
                else alert('Iltimos, to\'g\'ri summa kiriting (kamida 1,000 so\'m)');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Yuborilmoqda...';

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        amount: selectedAmount,
                        payment_method: 'card',
                        initData: tg.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg.showAlert) tg.showAlert(`✅ ${selectedAmount.toLocaleString('uz-UZ')} so'mlik to'lov so'rovingiz qabul qilindi! Admin tasdiqlashi bilan balansga qo'shiladi.`);
                    else alert(`✅ ${selectedAmount.toLocaleString('uz-UZ')} so'mlik to'lov so'rovingiz qabul qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1200);
                } else {
                    const err = data?.error || 'Xatolik yuz berdi';
                    if (tg.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg.showAlert) tg.showAlert('Xatolik: ' + err.message);
                else alert('Xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserBalance);
    </script>
</body>

</html>
