<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ — Telegram Sovg'alari</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css?v=14.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #08080c;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 10% 40%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 70%, rgba(245, 158, 11, 0.08) 0%, transparent 45%);
            color: #ffffff;
            padding: 16px;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Bar */
        .gift-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(24, 25, 34, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .balance-badge-pill {
            background: linear-gradient(135deg, rgba(24, 25, 34, 0.9) 0%, rgba(18, 19, 26, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 9px 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .balance-badge-pill span {
            color: #38bdf8;
        }

        /* Page Heading */
        .gift-page-header {
            margin-bottom: 18px;
        }

        .gift-page-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gift-page-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Category Filter Chips */
        .gift-category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 18px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gift-category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            flex-shrink: 0;
            background: rgba(24, 25, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .category-chip.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(124, 58, 237, 0.4) 100%);
            border-color: rgba(168, 85, 247, 0.6);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
        }

        /* Gifts Grid */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 24px;
            width: 100%;
            box-sizing: border-box;
        }

        .gift-card {
            background: linear-gradient(180deg, rgba(26, 27, 38, 0.95) 0%, rgba(15, 16, 24, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
        }

        .gift-card:active {
            transform: scale(0.97);
        }

        .gift-card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: #fbbf24;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
        }

        .gift-card-icon-wrap {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0 8px 0;
        }

        .gift-card-icon-wrap img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .gift-card:hover .gift-card-icon-wrap img {
            transform: scale(1.08);
        }

        .gift-card-name {
            font-size: 12.5px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .gift-card-stars {
            font-size: 10.5px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .gift-card-buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 9px 6px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .gift-card-buy-btn:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        /* Order Modal */
        .order-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .order-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .order-modal-card {
            background: linear-gradient(180deg, #181926 0%, #0e0f17 100%);
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            border-radius: 30px;
            padding: 26px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), 0 20px 40px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .order-modal-overlay.active .order-modal-card {
            transform: scale(1);
        }

        .modal-gift-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .modal-gift-icon img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
            animation: floatGift 3s infinite ease-in-out;
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .modal-gift-title {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .modal-gift-price-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .modal-price-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 999px;
        }

        /* Recipient Mode Tabs */
        .recipient-tabs {
            display: flex;
            background: #101118;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 12px;
            gap: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .recipient-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 6px;
            font-size: 11.5px;
            font-weight: 800;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recipient-tab.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .modal-input-wrap {
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
        }

        .modal-input-label {
            font-size: 12px;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        .modal-input-field {
            width: 100%;
            background: #101118;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .modal-input-field:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .modal-status-msg {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
            line-height: 1.4;
            display: none;
        }

        .modal-status-msg.error {
            color: #f87171;
            display: block;
        }

        .modal-status-msg.success {
            color: #4ade80;
            display: block;
        }

        .modal-actions-col {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        .modal-submit-btn:active {
            transform: scale(0.98);
        }

        .modal-cancel-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-cancel-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Deluxe Celebration Modal (Identical to Wheel Win Modal) */
        .win-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .win-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .win-modal-card {
            background: linear-gradient(180deg, #181926 0%, #0e0f17 100%);
            border: 1.5px solid rgba(251, 191, 36, 0.6);
            border-radius: 32px;
            padding: 28px 22px 22px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.35), 0 20px 40px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .win-modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 120px;
            background: radial-gradient(ellipse at top, rgba(251, 191, 36, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .win-modal-overlay.active .win-modal-card {
            transform: scale(1);
        }

        .win-badge-tag {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(217, 119, 6, 0.3) 100%);
            border: 1px solid rgba(251, 191, 36, 0.5);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .win-icon-burst {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.25) 0%, rgba(20, 21, 29, 0.8) 70%);
            border: 2px solid rgba(251, 191, 36, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.35);
        }

        .win-modal-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .win-prize-title {
            font-size: 17px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
        }

        .win-desc {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.45;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .win-claim-btn {
            width: 100%;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 14.5px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .win-claim-btn:active {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        .win-close-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .win-close-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

<body>

    <div class="gift-top-bar">
        <div class="back-pill-btn" onclick="window.location.href='index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="balance-badge-pill">
            <span>Balans:</span> <span id="balance">0</span> UZS
        </div>
    </div>

    <div class="gift-page-header">
        <div class="gift-page-title">
            <span>🎁 Telegram Sovg'alari</span>
        </div>
        <div class="gift-page-subtitle">O'zingiz yoki do'stlaringiz uchun original Telegram sovg'alarini xarid qiling!</div>
    </div>

    <div class="gift-category-scroll">
        <button class="category-chip active" onclick="filterGifts('all', this)">Barchasi</button>
        <button class="category-chip" onclick="filterGifts('vip', this)">👑 VIP</button>
        <button class="category-chip" onclick="filterGifts('classic', this)">🧸 Klassik</button>
        <button class="category-chip" onclick="filterGifts('deluxe', this)">💎 Hashamatli</button>
    </div>

    <div class="gifts-grid" id="giftsGrid"></div>

    <div class="order-modal-overlay" id="orderModal">
        <div class="order-modal-card">
            <div class="modal-gift-icon">
                <img id="modalImg" src="images/bear.webp" alt="Selected Gift">
            </div>
            <div class="modal-gift-title" id="modalTitle">Sovg'a</div>
            <div class="modal-gift-price-row">
                <div class="modal-price-badge" id="modalStars">50⭐</div>
                <div class="modal-price-badge" id="modalPrice">14 000 UZS</div>
            </div>

            <div class="recipient-tabs">
                <button type="button" class="recipient-tab active" id="tabSelf" onclick="setRecipientMode('self')">👤 O'zimga</button>
                <button type="button" class="recipient-tab" id="tabFriend" onclick="setRecipientMode('friend')">🎁 Do'stimga</button>
            </div>

            <div class="modal-input-wrap">
                <label class="modal-input-label" for="targetUsername">Username:</label>
                <input type="text" id="targetUsername" class="modal-input-field" placeholder="@username" autocomplete="off">
            </div>

            <div class="modal-status-msg" id="modalMsg"></div>

            <div class="modal-actions-col">
                <button type="button" class="modal-submit-btn" id="modalSubmitBtn" onclick="submitGiftOrder()">
                    <span>🎁 Sovg'ani Xarid Qilish</span>
                </button>
                <button type="button" class="modal-cancel-btn" onclick="closeOrderModal()">Bekor qilish</button>
            </div>
        </div>
    </div>

    <div class="win-modal-overlay" id="giftCelebrationModal">
        <div class="win-modal-card">
            <div class="win-badge-tag" id="celebrationBadge">👑 XARID MUBORAK!</div>
            <div class="win-icon-burst">
                <img id="celebrationImg" src="images/bear.webp" alt="Gift">
            </div>
            <div class="win-modal-title">XARID MUBORAK!</div>
            <div class="win-prize-title" id="celebrationPrizeTitle">Telegram Sovg'asi</div>
            <button class="win-claim-btn" onclick="claimGiftToAdmin()">🚀 Qabul Qilish</button>
            <button class="win-close-btn" onclick="closeCelebrationModal()">Yopish</button>
        </div>
    </div>

    <!-- Floating Capsule Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9z"></path>
                <path d="M9 21v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"></path>
            </svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn active" onclick="window.location.href='gift.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l4 6-10 12L2 9z"></path>
                <path d="M2 9h20"></path>
                <path d="M10 3l-3 6 5 12 5-12-3-6"></path>
            </svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const ALL_GIFTS = [
            // VIP 50 Stars Gifts — 10 000 UZS
            { id: 'aprel_bear', name: 'Aprel Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/aprel_bear.webp', badge: 'VIP' },
            { id: 'easter_bear', name: 'Pasxa Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/easter_bear.webp', badge: 'VIP' },
            { id: 'newyear_bear', name: 'Qorbobo Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/newyear_bear.webp', badge: 'VIP' },
            { id: 'builder_bear', name: 'Usta Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/builder_bear.webp', badge: 'VIP' },
            { id: 'football_bear', name: 'Futbolchi Ayiqcha', category: 'vip', stars: 50, price: 10000, img: 'images/football_bear.webp', badge: 'VIP' },
            { id: 'soldier_bear', name: 'Jangchi Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/soldier_bear.webp', badge: 'VIP' },
            { id: 'newyear_tree', name: 'Yangi Yil Archasi', category: 'vip', stars: 50, price: 10000, img: 'images/newyear_tree.webp', badge: 'VIP' },
            { id: 'patrick_bear', name: 'Patrik Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/patrick_bear.webp', badge: 'VIP' },
            { id: 'valentine_bear', name: 'Valentin Ayiqchasi', category: 'vip', stars: 50, price: 10000, img: 'images/valentine_bear.webp', badge: 'VIP' },
            { id: 'valentine_heart', name: 'Valentinka Yurakcha', category: 'vip', stars: 50, price: 10000, img: 'images/valentine_heart.webp', badge: 'VIP' },

            // Classic 15-25 Stars Gifts
            { id: 'bear', name: 'Teddy Bear', category: 'classic', stars: 15, price: 2800, img: 'images/bear.webp', badge: '15⭐' },
            { id: 'rose', name: 'Qizil Atirgul', category: 'classic', stars: 25, price: 5000, img: 'images/rose.webp', badge: '25⭐' },
            { id: 'box', name: 'Oltin Quticha', category: 'classic', stars: 25, price: 5000, img: 'images/box.webp', badge: '25⭐' },

            // Deluxe 50-100 Stars Gifts
            { id: 'bouqet', name: 'Guldasta', category: 'deluxe', stars: 50, price: 10000, img: 'images/bouqet.webp', badge: '50⭐' },
            { id: 'cake', name: 'Bayram Torti', category: 'deluxe', stars: 50, price: 10000, img: 'images/cake.webp', badge: '50⭐' },
            { id: 'rocket', name: 'Kosmik Raketa', category: 'deluxe', stars: 50, price: 10000, img: 'images/rocket.webp', badge: '50⭐' },
            { id: 'heart', name: 'Oltin Yurak', category: 'deluxe', stars: 50, price: 10000, img: 'images/heart.webp', badge: '50⭐' },
            { id: 'diamond', name: 'Brilliant', category: 'deluxe', stars: 100, price: 20000, img: 'images/diamond.webp', badge: '100⭐' },
            { id: 'ring', name: 'Olmos Uzuk', category: 'deluxe', stars: 100, price: 20000, img: 'images/ring.webp', badge: '100⭐' },
            { id: 'trophy', name: 'Oltin Kubok', category: 'deluxe', stars: 100, price: 20000, img: 'images/trophy.webp', badge: '100⭐' }
        ];

        let currentCategory = 'all';
        let selectedGift = null;
        let lastPurchasedGift = null;
        let lastPurchasedUsername = '';

        function renderGifts() {
            const grid = document.getElementById('giftsGrid');
            if (!grid) return;
            const filtered = currentCategory === 'all' ? ALL_GIFTS : ALL_GIFTS.filter(g => g.category === currentCategory);
            grid.innerHTML = filtered.map(g => `
                <div class="gift-card" onclick="openOrderModal('${g.id}')">
                    <span class="gift-card-badge">${g.badge}</span>
                    <div class="gift-card-icon-wrap"><img src="${g.img}" alt="${g.name}"></div>
                    <div class="gift-card-name">${g.name}</div>
                    <div class="gift-card-stars">${g.stars} Stars</div>
                    <button type="button" class="gift-card-buy-btn">${g.price.toLocaleString('uz-UZ')} UZS</button>
                </div>
            `).join('');
        }

        function filterGifts(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderGifts();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function setRecipientMode(mode) {
            const tabSelf = document.getElementById('tabSelf');
            const tabFriend = document.getElementById('tabFriend');
            const unameInput = document.getElementById('targetUsername');
            const tgUser = tg?.initDataUnsafe?.user;

            if (mode === 'self') {
                if (tabSelf) tabSelf.classList.add('active');
                if (tabFriend) tabFriend.classList.remove('active');
                if (tgUser && tgUser.username) {
                    unameInput.value = '@' + tgUser.username;
                } else {
                    unameInput.value = '';
                }
            } else {
                if (tabFriend) tabFriend.classList.add('active');
                if (tabSelf) tabSelf.classList.remove('active');
                unameInput.value = '';
                unameInput.focus();
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openOrderModal(giftId) {
            const gift = ALL_GIFTS.find(g => g.id === giftId);
            if (!gift) return;
            selectedGift = gift;
            document.getElementById('modalImg').src = gift.img;
            document.getElementById('modalTitle').textContent = gift.name;
            document.getElementById('modalStars').textContent = `${gift.stars}⭐ Stars`;
            document.getElementById('modalPrice').textContent = `${gift.price.toLocaleString('uz-UZ')} UZS`;
            setRecipientMode('self');
            
            const msgEl = document.getElementById('modalMsg');
            if (msgEl) {
                msgEl.className = 'modal-status-msg';
                msgEl.style.display = 'none';
            }

            document.getElementById('orderModal').classList.add('active');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
            selectedGift = null;
        }

        function closeCelebrationModal() {
            document.getElementById('giftCelebrationModal').classList.remove('active');
        }

        function showCelebrationModal(gift, targetUname) {
            lastPurchasedGift = gift;
            lastPurchasedUsername = targetUname;

            document.getElementById('celebrationImg').src = gift.img;
            document.getElementById('celebrationBadge').textContent = gift.category === 'vip' ? '👑 VIP XARID!' : '🎉 XARID MUBORAK!';
            document.getElementById('celebrationPrizeTitle').textContent = `${gift.name} (${gift.stars} Stars)`;
            
            if (window.confetti) {
                window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.55 } });
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            document.getElementById('giftCelebrationModal').classList.add('active');
        }

        function claimGiftToAdmin() {
            if (!lastPurchasedGift) return;
            const userId = tg?.initDataUnsafe?.user?.id || 1;
            const user = tg?.initDataUnsafe?.user || {};
            const uname = user.username ? ('@' + user.username) : 'Mavjud emas';
            const name = ((user.first_name || '') + ' ' + (user.last_name || '')).trim() || 'Foydalanuvchi';
            
            const messageText = 
                `Assalomu alaykum! Men CoinStat UZ'dan sovg'a sotib oldim 🎁\n\n` +
                `🎁 Sovg'a: ${lastPurchasedGift.name} (${lastPurchasedGift.stars} Stars)\n` +
                `👤 Xaridor: ${name}\n` +
                `🏷 Username: ${uname}\n` +
                `🎯 Qabul qiluvchi: @${lastPurchasedUsername}\n` +
                `🆔 Telegram ID: ${userId}\n\n` +
                `Iltimos, sovg'amni profilimga yuborishingizni so'rayman!`;

            const adminUrl = `https://t.me/cofeature?text=${encodeURIComponent(messageText)}`;

            if (tg && typeof tg.openTelegramLink === 'function') {
                tg.openTelegramLink(adminUrl);
            } else {
                window.open(adminUrl, '_blank');
            }
        }

        async function submitGiftOrder() {
            if (!selectedGift) return;
            const usernameInput = document.getElementById('targetUsername');
            const rawUsername = (usernameInput.value || '').trim();
            const cleanUsername = rawUsername.replace(/^@/, '');
            const msgEl = document.getElementById('modalMsg');
            const submitBtn = document.getElementById('modalSubmitBtn');

            if (!cleanUsername) {
                if (msgEl) {
                    msgEl.className = 'modal-status-msg error';
                    msgEl.textContent = "Iltimos, Telegram username'ni kiriting!";
                    msgEl.style.display = 'block';
                }
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳ Yuborilmoqda...</span>';

            const userId = tg?.initDataUnsafe?.user?.id || 1;
            const apiBase = (typeof getApiBase === 'function') ? getApiBase() : '';
            const currentGift = selectedGift;

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/gift', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: cleanUsername,
                        gift_name: currentGift.name,
                        amount: currentGift.price,
                        initData: tg?.initData || ''
                    })
                });

                let data = null;
                try { data = await res.json(); } catch(e) {}

                if (data && data.ok) {
                    closeOrderModal();
                    if (typeof loadUserBalance === 'function') loadUserBalance();
                    showCelebrationModal(currentGift, cleanUsername);
                } else {
                    const errText = data?.error || "Hisobingizda mablag' yetarli emas yoki xatolik yuz berdi!";
                    if (msgEl) {
                        msgEl.className = 'modal-status-msg error';
                        msgEl.textContent = errText;
                        msgEl.style.display = 'block';
                    }
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            } catch(e) {
                if (msgEl) {
                    msgEl.className = 'modal-status-msg error';
                    msgEl.textContent = "Server bilan aloqa o'rnatilmadi. Iltimos, keyinroq qayta urinib ko'ring!";
                    msgEl.style.display = 'block';
                }
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = "<span>🎁 Sovg'ani Xarid Qilish</span>";
        }

        // Initialize immediately
        renderGifts();
        if (typeof loadUserBalance === 'function') loadUserBalance();
        document.addEventListener('DOMContentLoaded', () => {
            renderGifts();
            if (typeof loadUserBalance === 'function') loadUserBalance();
        });
    </script>
</body>

</html>
